# Detector configuration and thresholds
rate_hz: 10.0 # Runs every 100 ms

hysteresis:
  confirm_n: 5
  high_threshold: 0.75
  low_threshold: 0.25

thresholds:
  gps_mahalanobis_dist: 4.5       # Mahalanobis distance vs trusted filter over 2s window
  gps_nis_chi2_99: 11.345         # Chi-square 3 DOF at 99% confidence
  watchdog_rate_drop_fraction: 0.70  # Below 70% nominal rate
  watchdog_max_age_sec: 0.300     # Age above 300 ms
  imu_vision_vel_divergence: 0.8  # m/s divergence
  lidar_baro_alt_diff: 1.5        # meters discrepancy

window_sizes:
  gps_window_sec: 2.0
  rate_window_sec: 1.0
