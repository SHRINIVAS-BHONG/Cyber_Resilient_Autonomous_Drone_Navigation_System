# Resilience Manager configuration
rate_hz: 10.0

states:
  - NORMAL
  - SUSPICIOUS
  - ATTACK_CONFIRMED
  - CONTAINMENT
  - SAFE_NAVIGATION
  - RECOVERY
  - RECOVERED

trust_decay:
  suspicious_penalty: 0.15
  attack_penalty: 0.50
  recovery_reward_per_sec: 0.20

containment:
  covariance_inflation_factor: 10.0
  reintegration_dwell_sec: 5.0    # 5 s continuous agreement required
  reintegration_ramp_sec: 3.0     # Ramp covariance back down over 3 s
  max_compromised_sensors_before_abort: 2 # >= 2 triggers hover/safe landing
  min_estimator_confidence: 0.35  # Below this triggers emergency landing

safe_landing_zone:
  x: 62.0
  y: 38.0
  z: 0.0
