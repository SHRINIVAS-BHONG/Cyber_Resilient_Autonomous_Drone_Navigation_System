# Sensor configuration and noise models
gps:
  rate_hz: 10.0
  position_noise_sigma: 0.5   # meters (x, y)
  altitude_noise_sigma: 0.8   # meters (z)
  velocity_noise_sigma: 0.1   # m/s

imu:
  rate_hz: 100.0
  accel_noise_sigma: 0.05     # m/s^2
  gyro_noise_sigma: 0.01      # rad/s
  accel_bias_constant: [0.02, -0.01, 0.01]  # m/s^2

barometer:
  rate_hz: 20.0
  altitude_noise_sigma: 0.3   # meters

lidar:
  rate_hz: 10.0
  range_min: 0.2              # meters
  range_max: 30.0             # meters
  noise_sigma: 0.03           # meters
  beam_count: 360

vision:
  rate_hz: 20.0
  position_noise_sigma: 0.1   # meters
  drift_rate_per_sec: 0.02    # m/s drift accumulation
