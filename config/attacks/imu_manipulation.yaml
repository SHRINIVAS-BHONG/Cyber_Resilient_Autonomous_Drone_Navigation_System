# Attack Scenario: IMU Manipulation
attack:
  name: "IMU Constant Bias & High Noise Injection"
  target_sensor: "imu"
  type: "imu_manipulation"
  enabled: true
  start_time_sec: 40.0
  duration_sec: 20.0

  parameters:
    accel_bias:
      ax: 1.8    # m/s^2 bias
      ay: -1.2
      az: 0.5
    gyro_bias:
      gx: 0.15   # rad/s bias
      gy: -0.10
      gz: 0.05
    noise_scaling: 4.0
