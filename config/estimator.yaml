# Estimator (EKF) configuration
state_dimension: 10 # px, py, pz, vx, vy, vz, bax, bay, baz, yaw
rate_hz: 50.0

process_noise:
  pos: 0.01
  vel: 0.1
  acc_bias: 0.001
  yaw: 0.005

measurement_noise:
  gps_pos: 0.5
  gps_vel: 0.1
  baro_alt: 0.3
  vision_pos: 0.15
  lidar_alt: 0.05

initial_covariance:
  pos: 1.0
  vel: 0.5
  acc_bias: 0.1
  yaw: 0.1

filters:
  main:
    use_gps: true
    use_imu: true
    use_baro: true
    use_vision: true
    use_lidar: true
  trusted:
    use_gps: false # Never uses GPS
    use_imu: true
    use_baro: true
    use_vision: true
    use_lidar: true
