# Path Planner (A*) configuration
grid:
  resolution: 1.0       # 1 meter per cell
  x_min: -10.0
  x_max: 90.0
  y_min: -10.0
  y_max: 70.0

inflation:
  normal_m: 2.0         # 2.0m inflation normally
  attack_m: 3.5         # 3.5m inflation during attack

speed_limits:
  nominal_mps: 3.0      # Cruise speed 3 m/s
  degraded_mps: 1.5     # Degraded speed limit 1.5 m/s

cost_weights:
  distance: 1.0
  obstacle_proximity: 3.0
  uncertainty: 2.0
  cyber_risk: 4.0

restricted_zones:
  - {name: "restricted_zone_1", min_x: 25.0, max_x: 35.0, min_y: 20.0, max_y: 35.0}

default_obstacles:
  - {x: 20.0, y: 15.0, radius: 3.0, height: 15.0}
  - {x: 35.0, y: 22.0, radius: 4.0, height: 15.0}
  - {x: 48.0, y: 32.0, radius: 3.5, height: 15.0}
  - {x: 28.0, y: 38.0, radius: 3.0, height: 15.0}
  - {x: 10.0, y: 25.0, radius: 2.5, height: 15.0}

mission:
  takeoff_altitude: 10.0
  start_point: [0.0, 0.0, 10.0]
  goal_point: [60.0, 40.0, 10.0]
  landing_zone: [62.0, 38.0, 0.0]
  nominal_waypoints:
    - [15.0, 8.0, 10.0]
    - [30.0, 18.0, 10.0]
    - [45.0, 30.0, 10.0]
    - [60.0, 40.0, 10.0]
