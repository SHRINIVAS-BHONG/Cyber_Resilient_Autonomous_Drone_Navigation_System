[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyber-resilient-drone-cps"
version = "1.0.0"
description = "Cyber-Physical System (CPS) for Autonomous Drone Navigation Resilience under Cyber Attacks"
readme = "README.md"
requires-python = ">=3.10, <3.11"
license = { text = "MIT" }
authors = [
    { name = "Autonomous Systems & Cyber-Physical Security Lab" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Robotics",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10"
]
dependencies = [
    "numpy>=1.24.3,<2.0.0",
    "scipy>=1.10.1,<=1.11.4",
    "pandas>=2.0.3,<=2.1.4",
    "scikit-learn>=1.3.0,<=1.3.2",
    "joblib>=1.3.2,<1.5.0",
    "fastapi>=0.104.1,<0.110.0",
    "uvicorn[standard]>=0.24.0,<0.29.0",
    "pydantic>=2.5.3,<2.7.0",
    "requests>=2.31.0,<3.0.0",
    "streamlit>=1.30.0,<1.32.0",
    "plotly>=5.18.0,<6.0.0",
    "matplotlib>=3.7.5,<3.9.0",
    "pyyaml>=6.0.1",
    "websockets>=12.0,<13.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.3,<8.0.0",
    "pytest-asyncio>=0.21.1,<0.23.0",
    "pytest-cov>=4.1.0,<5.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*"
]
